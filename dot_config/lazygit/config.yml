git:
  diffRenderers:
    - command: delta --paging=never
gui:
  # Accepts any decimal from 0 to 1.0 (Default is 0.3333)
  # A lower number like 0.2 gives you more room for code diffs.
  sidePanelWidth: 0.24
  theme:
    # This color applies to the selected line in the diff/hunk pane
    selectedLineBgColor:
      - '#212829'  # Example: A darker grey (or use 'black' or 'default')
